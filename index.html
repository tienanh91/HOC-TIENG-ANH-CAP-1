<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Đảo Học Vui</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: bản đồ các "đảo" (cấp độ) → bài học → trò chơi; nút bấm kiểu đồ chơi nổi khối, một cột trên điện thoại */
:root{
  --bg:#E8F5F2; --bg2:#D6EEE8; --card:#FFFFFF; --ink:#1D2944; --muted:#56678A; --line:#C9E1DB;
  --orange:#FF8C42; --sun:#FFC53D; --leaf:#34B872; --sky:#3A9FEA; --berry:#EF5A82; --grape:#9470DB;
  --good:#1FA35A; --bad:#E0473C; --onc:#1B2540; --shadow:rgba(29,41,68,.16); --soft:#F3FAF8;
  --display:'Baloo 2','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#112036; --bg2:#172B47; --card:#1E3354; --ink:#EEF4FF; --muted:#A7B7D4; --line:#2C4569;
  --shadow:rgba(0,0,0,.45); --soft:#19304F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#112036; --bg2:#172B47; --card:#1E3354; --ink:#EEF4FF; --muted:#A7B7D4; --line:#2C4569;
  --shadow:rgba(0,0,0,.45); --soft:#19304F; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  background-image:radial-gradient(circle at 12% 8%, var(--bg2) 0 120px, transparent 121px),radial-gradient(circle at 92% 30%, var(--bg2) 0 90px, transparent 91px);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:2px dashed var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.35rem;cursor:pointer;background:none;border:0;padding:0}
.logo .owl{font-size:1.8rem}
.nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:800;cursor:pointer;white-space:nowrap}
.chip:focus-visible,.btn:focus-visible,.tile:focus-visible,.card:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.chip.on{background:var(--sun);color:var(--onc);border-color:var(--sun)}
@media (max-width:620px){.chip .lbl{display:none}.logo span.t{font-size:1.15rem}}

/* toy buttons */
.btn{--c:var(--orange);border:0;border-radius:18px;background:var(--c);color:var(--onc);font-family:var(--display);font-weight:800;font-size:1.1rem;
  padding:12px 20px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 62%,#000);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 62%,#000)}
.btn.ghost{--c:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);color:var(--ink)}
.btn.sm{font-size:.95rem;padding:8px 14px;border-radius:14px}
.btn.big{font-size:1.35rem;padding:16px 28px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 6px 0 var(--shadow)}
section{margin-top:22px}
.muted{color:var(--muted)}
.eyebrow{font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:18px}
.mascot{font-size:5.2rem;line-height:1;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 18px;box-shadow:0 6px 0 var(--shadow);min-width:0}
.bubble::before{content:"";position:absolute;left:-12px;top:30px;border:10px solid transparent;border-right-color:var(--line);border-left:0}
.bubble h1{font-size:clamp(1.6rem,4.5vw,2.3rem)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.stat{background:var(--soft);border-radius:14px;padding:6px 12px;font-weight:800;font-variant-numeric:tabular-nums}

/* island map */
.islands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:760px){.islands{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.islands{grid-template-columns:1fr}}
.island{--c:var(--orange);position:relative;text-align:left;cursor:pointer;border:0;border-radius:28px;padding:18px 18px 16px;background:var(--card);
  box-shadow:0 7px 0 color-mix(in srgb,var(--c) 55%,#000);outline:3px solid var(--c);outline-offset:-3px;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.island:hover{transform:translateY(-3px) rotate(-.6deg)}
.island .top{display:flex;justify-content:space-between;align-items:flex-start}
.island .em{font-size:2.8rem;line-height:1}
.badge{background:var(--c);color:var(--onc);font-family:var(--display);font-weight:800;border-radius:12px;padding:2px 10px;font-size:.9rem}
.island h3{font-size:1.5rem}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}

/* units */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.unit{--c:var(--orange);cursor:pointer;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:22px;padding:14px;box-shadow:0 5px 0 var(--shadow);display:flex;flex-direction:column;gap:6px}
.unit:hover{border-color:var(--c)}
.unit .em{font-size:2.4rem}
.unit .n{font-family:var(--display);font-weight:800;color:var(--muted);font-size:.9rem}
.unit h3{font-size:1.25rem}
.dots{display:flex;gap:5px}
.dots b{width:12px;height:12px;border-radius:50%;background:var(--soft);border:2px solid var(--line)}
.dots b.on{background:var(--c);border-color:var(--c)}

.lvhead{--c:var(--orange);display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:18px}
.lvhead .em{font-size:3.6rem;background:var(--card);border:3px solid var(--c);border-radius:24px;width:88px;height:88px;display:grid;place-items:center}
.lvhead h1{font-size:clamp(1.7rem,5vw,2.5rem)}
.back{margin-top:14px}

.words{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:14px;padding:6px 10px;background:var(--soft);cursor:pointer;font-weight:700}
.wchip .p{font-size:1.4rem}
.wchip .tp{font-family:var(--display);font-weight:800;font-size:.85rem;background:var(--sun);color:var(--onc);border-radius:8px;padding:0 6px}
.sent{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:2px dashed var(--line)}
.sent:first-child{border-top:0}
.say{border:0;background:var(--sky);color:var(--onc);border-radius:12px;width:40px;height:40px;flex:none;cursor:pointer;font-size:1.2rem;box-shadow:0 3px 0 color-mix(in srgb,var(--sky) 60%,#000)}

.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.act{position:relative;cursor:pointer;border:2px solid var(--line);background:var(--card);border-radius:22px;padding:16px 12px;text-align:center;box-shadow:0 5px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px}
.act .em{font-size:2.6rem}
.act b{font-family:var(--display);font-size:1.15rem}
.act small{color:var(--muted);line-height:1.3}
.act .ok{position:absolute;top:8px;right:10px;background:var(--good);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:900}

/* game */
.gtop{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.gtop h2{font-size:1.4rem;flex:1;min-width:0}
.prog{flex-basis:100%;display:flex;gap:4px}
.prog i{flex:1;height:10px;border-radius:99px;background:var(--card);border:2px solid var(--line)}
.prog i.d{background:var(--leaf);border-color:var(--leaf)}
.prog i.c{background:var(--sun);border-color:var(--sun)}
.stage{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.prompt{font-family:var(--display);font-weight:700;font-size:1.25rem}
.vi{color:var(--muted);font-weight:700}
.bigpic{font-size:7rem;line-height:1.1;background:var(--card);border:3px solid var(--line);border-radius:32px;width:min(260px,70vw);aspect-ratio:1;display:grid;place-items:center;box-shadow:0 8px 0 var(--shadow);max-width:100%}
.bigpic .tp,.tile .tp{font-family:var(--display);font-weight:800;font-size:.55em;background:var(--sun);color:var(--onc);border-radius:24px;padding:0 .35em}
.speaker{font-size:4rem;width:150px;height:150px;border-radius:50%}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(520px,100%)}
.tile{border:3px solid var(--line);background:var(--card);border-radius:24px;cursor:pointer;padding:12px;box-shadow:0 6px 0 var(--shadow);font-family:var(--display);font-weight:800;font-size:1.4rem;min-height:110px;display:grid;place-items:center;transition:transform .1s}
.tile.pic{font-size:3.8rem}
.tile.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 22%,var(--card))}
.tile.bad{border-color:var(--bad);opacity:.55}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.12)}}

/* flash */
.flash{width:min(380px,100%);perspective:900px}
.fcard{position:relative;width:100%;aspect-ratio:4/5;max-width:100%;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:32px;background:var(--card);border:3px solid var(--line);box-shadow:0 8px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px}
.face .p{font-size:7.5rem;line-height:1.1}
.face .p .tp{font-family:var(--display);font-weight:800;font-size:.6em;background:var(--sun);color:var(--onc);border-radius:24px;padding:0 .3em}
.face .w{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1.1}
.face.back{transform:rotateY(180deg);background:var(--soft)}
.face.back .w{font-size:2rem}
.hint{font-size:.9rem;color:var(--muted);font-weight:700}

/* match */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(560px,100%)}
@media (max-width:480px){.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mc{aspect-ratio:1;border-radius:18px;border:3px solid var(--line);cursor:pointer;background:var(--sky);box-shadow:0 5px 0 color-mix(in srgb,var(--sky) 60%,#000);display:grid;place-items:center;font-size:2rem;font-family:var(--display);font-weight:800;color:var(--onc);padding:4px;max-width:100%}
.mc.open{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--shadow)}
.mc.open.word{font-size:clamp(.85rem,3.2vw,1.15rem);line-height:1.1;word-break:break-word}
.mc.open.pic{font-size:clamp(2rem,9vw,2.8rem)}
.mc.open.pic .tp{font-size:.6em;background:var(--sun);color:var(--onc);border-radius:10px;padding:0 .25em}
.mc.done{background:color-mix(in srgb,var(--good) 25%,var(--card));border-color:var(--good);cursor:default}

/* spell & sentence */
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.slot{width:44px;height:54px;border-radius:12px;border:3px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.7rem;background:var(--card)}
.slot.f{border-style:solid;border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 18%,var(--card))}
.slot.gap{border:0;background:none;width:16px}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.lt{--c:var(--sun);width:52px;height:56px;padding:0;font-size:1.6rem}
.lt[disabled]{opacity:.25;pointer-events:none}
.ans{min-height:70px;width:min(640px,100%);border:3px dashed var(--line);border-radius:20px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;background:var(--card)}
.ans.good{border-style:solid;border-color:var(--good)}
.tok{--c:var(--sky);font-size:1.15rem;padding:8px 14px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px}

/* result */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:30px}
.result .trophy{font-size:6rem;line-height:1}
.result .got{font-family:var(--display);font-size:2rem;font-weight:800}

/* đọc theo (karaoke) */
.sbtns{display:flex;flex-direction:column;gap:6px;flex:none}
.say.slow{background:var(--leaf);box-shadow:0 3px 0 color-mix(in srgb,var(--leaf) 60%,#000)}
.ra{font-size:1.2rem;cursor:pointer;line-height:1.7}
.rw{border-radius:8px;padding:1px 3px;transition:background .15s,color .15s}
.rw.on{background:var(--sun);color:var(--onc)}
.tv .rw.on{background:var(--card);color:var(--ink)}
.speakline{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,5.5vw,2.3rem);line-height:1.5;max-width:100%}
.rw.hit{background:color-mix(in srgb,var(--good) 30%,transparent)}
.heard{min-height:1.6em;font-weight:700;color:var(--muted);max-width:60ch}
.okmsg{color:var(--good);font-size:1.3rem}
.mic.on{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
/* video */
a.btn{text-decoration:none}
ul.tips a{color:var(--sky)}
.tv{position:relative;width:min(680px,100%);max-width:100%;aspect-ratio:16/10;border-radius:28px;border:8px solid var(--ink);overflow:hidden;background:var(--scene,var(--sun));color:var(--onc);box-shadow:0 8px 0 var(--shadow);transition:background .5s}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 12px 36px}
.scene .sp{position:relative;z-index:1;font-size:clamp(4rem,15vw,7.5rem);line-height:1.05;animation:zoomIn .6s cubic-bezier(.3,1.6,.5,1),wig 1.6s .6s ease-in-out infinite}
.scene .sp .tp{font-family:var(--display);font-weight:800;font-size:.6em;background:var(--card);color:var(--ink);border-radius:24px;padding:0 .3em}
.scene .sw{position:relative;z-index:1;font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,7vw,3.2rem);line-height:1.1}
.scene .sv{position:relative;z-index:1;font-weight:800;font-size:clamp(1rem,3.6vw,1.3rem);animation:fadeIn .4s 1.2s both}
.lk{display:inline-block;animation:lpop .45s both}
.deco{position:absolute;font-size:2rem;opacity:.35;animation:drift 6s ease-in-out infinite alternate}
.tvcap{position:absolute;left:0;right:0;bottom:0;padding:6px 12px;font-weight:800;font-size:.95rem;background:rgba(255,255,255,.4);text-align:center}
@keyframes zoomIn{from{transform:scale(.2) rotate(-20deg);opacity:0}}
@keyframes wig{50%{transform:rotate(6deg) scale(1.06)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes lpop{50%{transform:scale(1.5) translateY(-10px)}}
@keyframes drift{from{transform:translateY(30px) rotate(-15deg)}to{transform:translateY(-30px) rotate(15deg)}}
/* bóng bay */
.skybox{position:relative;width:min(680px,100%);height:min(460px,60vh);border-radius:28px;overflow:hidden;border:3px solid var(--line);background:linear-gradient(color-mix(in srgb,var(--sky) 40%,var(--bg)),var(--bg2))}
.cloud{position:absolute;font-size:3rem;opacity:.75}
.balloon{--c:var(--berry);position:absolute;width:21%;aspect-ratio:4/5;border:0;border-radius:50% 50% 46% 46%/55% 55% 45% 45%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),transparent 32%),var(--c);color:var(--onc);cursor:pointer;display:grid;place-items:center;font-size:clamp(1.8rem,7vw,2.8rem);font-family:var(--display);font-weight:800;padding:4px;animation:rise var(--d,8s) linear infinite;animation-delay:var(--dl,0s)}
.balloon.word{font-size:clamp(.8rem,3.2vw,1.15rem);line-height:1.1;word-break:break-word}
.balloon .tp{font-size:.6em;background:var(--card);color:var(--ink);border-radius:10px;padding:0 .25em}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:44px;background:var(--muted)}
.balloon.bad{opacity:.35;pointer-events:none}
.balloon.popped{animation:boom .35s forwards;pointer-events:none}
@keyframes rise{from{top:100%}to{top:-42%}}
@keyframes boom{to{transform:scale(1.8);opacity:0}}

.strictrow{display:flex;gap:10px;align-items:flex-start;margin:6px 0 4px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--soft);cursor:pointer}
.strictrow input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--leaf)}
/* trang đầu, Tiếng Việt, Cửu chương */
.hubgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.hubisland .em{font-size:3.4rem}
.hubisland h3{font-size:1.7rem}
.vbig{font-family:var(--display);font-weight:800;font-size:clamp(3.6rem,16vw,6.4rem);line-height:1.05;color:var(--ink)}
.vbig.ccq{font-size:clamp(2.2rem,10vw,3.6rem);font-variant-numeric:tabular-nums}
.vq{font-family:var(--display);font-weight:700;font-size:clamp(1.15rem,4.4vw,1.5rem);max-width:36ch;text-align:center;line-height:1.4}
.vpic{font-size:3.4rem;line-height:1}
.blank{display:inline-block;min-width:1.8em;border-bottom:4px solid var(--berry);color:var(--berry);text-align:center}
.vopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(560px,100%)}
.vopts .tile{min-height:72px;font-size:1.15rem;line-height:1.25}
.vopts .tile.pic{font-size:3.4rem;min-height:110px}
.vlt{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1}
.mc .vlt{font-size:clamp(1.6rem,7vw,2.4rem)}
.mole .vl{font-family:var(--display);font-weight:800;font-size:.85em}
.baskets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;width:min(640px,100%)}
.baskets .tile{min-height:110px;font-size:1.1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.baskets .bk{font-size:2.4rem}
.act .diff{font-size:.78rem;font-weight:800;color:var(--muted)}
.tipcard{border-left:8px solid var(--sun)}
.cand{display:inline-block;padding:2px 12px;border-radius:12px;background:var(--sun);color:var(--onc);font-family:var(--display);font-weight:800}
.cand .vlt{font-size:1.6rem}
.lchip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:16px;padding:6px 12px;background:var(--soft);cursor:pointer;font-weight:700}
.lchip .L{font-family:var(--display);font-size:1.7rem;font-weight:800}
.lchip .p{font-size:1.5rem}
.ghepline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.5rem}

const fx=$("#fx"),ctx=fx.getContext("2d");
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  fx.width=innerWidth;fx.height=innerHeight;
  const cols=["#FF8C42","#FFC53D","#34B872","#3A9FEA","#EF5A82","#9470DB"];
  const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,s:6+Math.random()*7,c:cols[Math.random()*6|0],r:Math.random()*6}));
  let f=0;(function step(){ctx.clearRect(0,0,fx.width,fx.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore()});if(++f<110)requestAnimationFrame(step);else ctx.clearRect(0,0,fx.width,fx.height)})();
}

  const today=dayStr(new Date()),y=new Date();y.setDate(y.getDate()-1);

}

  let run=0;

    const go=()=>one(+el.dataset.ra,!!el.dataset.slow);
    el.onclick=go;if(el.classList.contains("ra"))el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};
  });

function raHTML(text){let ci=0;return text.split(" ").map(w=>{const h=`<span class="rw" data-ci="${ci}">${esc(w)}</span>`;ci+=w.length+1;return h}).join(" ")}
function readAlong(el,text,rate=.85){return new Promise(res=>{
  const spans=[...el.querySelectorAll(".rw")];let got=false,timer=null,done=false;
  const mark=i=>spans.forEach((s,k)=>s.classList.toggle("on",k===i));
  const end=()=>{if(done)return;done=true;clearInterval(timer);clearTimeout(safety);mark(-1);res()};
  const safety=setTimeout(end,2500+text.length*160/rate);
  if(!("speechSynthesis" in window)){say(text);return end()}
  try{
    const u=new SpeechSynthesisUtterance(text);u.lang="en-US";if(voice)u.voice=voice;u.rate=rate;u.pitch=1.05;
    u.onboundary=e=>{if(done||(e.name&&e.name!=="word"))return;got=true;clearInterval(timer);let i=0;spans.forEach((s,k)=>{if(+s.dataset.ci<=e.charIndex)i=k});mark(i)};
    u.onstart=()=>{mark(0);setTimeout(()=>{if(!got&&!done){let i=0;timer=setInterval(()=>{i++;if(i<spans.length)mark(i)},Math.round(400/rate))}},450)};
    u.onend=end;u.onerror=end;
    speechSynthesis.cancel();setTimeout(()=>{if(!done)speechSynthesis.speak(u)},40);
  }catch(e){end()}
})}

/* ================== TRÒ CHƠI ================== */
function shell(title,back,n){
  return `<div class="gtop"><button class="btn ghost sm" data-go="${back}">✕</button><h2>${title}</h2><span class="chip">⭐ <b id="gs">0</b></span>
  <div class="prog" id="prog">${Array.from({length:n},()=>"<i></i>").join("")}</div></div><div class="stage" id="stage"></div>`;
}
function setProg(i,cur=true){document.querySelectorAll("#prog i").forEach((el,k)=>{el.className=k<i?"d":(k===i&&cur?"c":"")})}
function bump(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}

function game(act,li,ui){
  const L=LEVELS[li],u=L&&L.units[ui];if(!u)return home();
  const back=`u-${li}-${ui}`,a=ACTS.find(x=>x.id===act)||FUN.find(x=>x.id===act);if(!a)return unit(li,ui);
  gameFns()[act](u,L,back,act);
}
function finish({stars,max,back,key,act,again,label,vi,next}){
  if(key)markDone(key,act);
  addStars(stars);sWin();confetti();
  const ratio=max?stars/max:1;
  const msg=vi?(ratio>=.9?"Xuất sắc!":ratio>=.6?"Giỏi lắm!":"Cố lên nhé!"):ratio>=.9?"Excellent! Xuất sắc!":ratio>=.6?"Great job! Giỏi lắm!":"Good try! Cố lên nhé!";
  if(vi)sayVi(msg);else say(msg.split("!")[0]+"!");
  const nextAct=next!==undefined?next:key&&/^u-/.test(back)&&(()=>{const u=LEVELS[+back.split("-")[1]].units[+back.split("-")[2]];const list=actsFor(u.li);const i=list.findIndex(x=>x.id===act);return i<0?null:list[i+1]})();
  $("#stage").innerHTML=`<div class="result">
    <div class="trophy">${ratio>=.9?"🏆":ratio>=.6?"🥇":"🌟"}</div>
    <div class="got">${msg}</div>
    <div class="prompt">${label||"Bé được"} <b>+${stars} ⭐</b>${max?` <span class="muted">(${stars}/${max})</span>`:""}</div>
    <div class="row" style="justify-content:center">
      <button class="btn ghost" id="again">↻ Chơi lại</button>
      ${nextAct?`<button class="btn" style="--c:var(--leaf)" data-go="${nextAct.go||`g-${nextAct.id}-${back.split("-")[1]}-${back.split("-")[2]}`}">${nextAct.em} ${nextAct.name} →</button>`:`<button class="btn" style="--c:var(--leaf)" data-go="${back}">Xong ✓</button>`}
    </div></div>`;
  $("#again").onclick=again;
  setProg(99,false);
}

/* Chế độ "sai phải làm lại từ đầu" (phụ huynh bật/tắt trong hồ sơ bé, mặc định bật) */
const strictOn=()=>P().strict!==false;
function strictFail(again,msg){
  if(!strictOn())return false;
  stopMedia();try{speechSynthesis.cancel()}catch(e){}
  const ov=document.createElement("div");ov.className="redo";
  ov.innerHTML=`<div class="redobox"><div class="redoem">🙈</div><b>Sai rồi!</b>${msg?`<span>${msg}</span>`:""}<span>Bé làm lại từ đầu nhé!</span><div class="redobar"><i></i></div></div>`;
  document.body.appendChild(ov);
  const t=setTimeout(()=>{ov.remove();again()},2600);
  stopMedia=()=>{clearTimeout(t);ov.remove()};
  return true;
}

/* 1. Thẻ từ: bé đọc đúng thì thẻ tự lật */
function gFlash(u,L,back,act){
  render(shell(`🃏 Thẻ từ · ${esc(u.t)}`,back,u.words.length));
  let i=0,score=0,micOn=false,subs=[],heard="",partial="",ignoreUntil=0,passed=false,autoT,spk=0;
  const got=new Set();
  const unsub=()=>{subs.forEach(f=>{try{f()}catch(e){}});subs=[]};
  stopMedia=()=>{clearTimeout(autoT);unsub();dstop();micOn=false;try{speechSynthesis.cancel()}catch(e){}};
  const hasMic=()=>!!DICT&&!DICT_OFF;
  /* máy đọc mẫu: bỏ qua những gì micrô nghe trong lúc này */
  const speakW=async(text,rate=.85)=>{const my=++spk;ignoreUntil=Infinity;await sayP(text,rate);if(my===spk){ignoreUntil=Date.now()+900;heard="";partial=""}};
  const end=()=>{stopMedia();finish({stars:score,max:u.words.length,back,key:u.key,act,again:()=>gFlash(u,L,back,act),label:"Học xong thẻ từ! Bé được"})};
  const flip=()=>{const fc=$("#fc");if(!fc||passed)return;passed=true;fc.classList.add("flip");sGood();
    if(!got.has(i)){got.add(i);score++;$("#gs").textContent=score}
    $("#fheard").innerHTML=`<b class="okmsg">🎉 Đúng rồi! Giỏi quá!</b>`;
    clearTimeout(autoT);autoT=setTimeout(()=>{if(i<u.words.length-1){i++;show()}else end()},2300)};
  const onText=()=>{if(passed)return;const t=(heard+" "+partial).trim();const h=$("#fheard");if(h)h.textContent=t?`🎧 “${t}”`:"";
    if(matchOK(u.words[i].en,t))flip()};
  const drawMic=()=>{const c=$("#mic");if(!c)return;
    if(hasMic()){
      c.innerHTML=micOn?`<button class="btn mic on" style="--c:var(--berry)" id="micb">🔴 Cú Bông đang nghe… (chạm để tắt)</button>`
        :`<button class="btn big mic" style="--c:var(--berry)" id="micb">🎙️ Bật micrô để đọc</button>`;
      $("#micb").onclick=toggleMic;
    }else{
      c.innerHTML=`<button class="btn big" style="--c:var(--leaf)" id="okp">✓ Bé đọc đúng rồi</button><div class="muted" style="flex-basis:100%;font-size:.9rem">Thiết bị này chưa nghe được giọng bé. Phụ huynh nghe bé đọc, đúng thì bấm ✓ để lật thẻ.</div>`;
      $("#okp").onclick=flip;
    }};
  const toggleMic=()=>{
    if(micOn||DICT.active()){dstop();return}
    let p;try{p=DICT.start({language:"en"})}catch(e){DICT_OFF=true;drawMic();return}
    unsub();heard="";partial="";
    subs.push(
      DICT.onFinal(e=>{if(Date.now()<ignoreUntil)return;heard+=e.text;onText()}),
      DICT.onPartial(e=>{if(Date.now()<ignoreUntil){partial="";return}partial=e.text;onText()}),
      DICT.onState(e=>{
        if(e.state==="listening"){micOn=true;drawMic()}
        if(e.state==="idle"){micOn=false;unsub();
          if(e.reason==="not_granted"||e.reason==="unavailable")DICT_OFF=true;
          if(e.reason==="rate_limited"||e.reason==="upstream_error")toast("Micrô đang bận, bé bấm 🎙️ thử lại nhé!");
          drawMic()}
      }));
    p.catch(err=>{const c=err&&err.code;
      if(c==="dismissed")toast("Bé bấm lại 🎙️ và chọn Cho phép để Cú Bông nghe được nhé!",3200);
      else if(c==="not_granted"||c==="unavailable"){DICT_OFF=true;toast("Chưa dùng được micrô, chuyển sang để phụ huynh chấm.",3200);drawMic()}});
  };
  const show=()=>{
    SAY=[];clearTimeout(autoT);const w=u.words[i];passed=false;heard="";partial="";setProg(i);
    $("#stage").innerHTML=`
      <div class="prompt">Bé đọc to từ trên thẻ, đọc đúng thẻ sẽ tự lật!</div>
      <div class="flash"><div class="fcard" id="fc" aria-label="Thẻ từ ${esc(w.en)}">
        <div class="face"><div class="p">${pic(w.pic)}</div><div class="w">${esc(w.en)}</div><div class="hint">🗣️ Bé đọc: “${esc(w.en)}”</div></div>
        <div class="face back"><div class="p" style="font-size:4.5rem">${pic(w.pic)}</div><div class="w">${esc(w.vi)}</div><div class="hint">${esc(w.en)}</div></div>
      </div></div>
      <div class="heard" id="fheard"></div>
      <div class="row" id="mic" style="justify-content:center"></div>
      <div class="row" style="justify-content:center">
        <button class="btn ghost" id="prev" ${i===0?"disabled":""}>◀</button>
        <button class="btn" style="--c:var(--sky)" id="hear">🔊 Nghe</button>
        <button class="btn" style="--c:var(--leaf)" id="slow">🐢 Nghe chậm</button>
        <button class="btn" id="next">${i===u.words.length-1?"Xong ✓":"▶"}</button>
      </div>`;
    const fc=$("#fc");fc.onclick=()=>{if(passed)fc.classList.toggle("flip")};
    $("#hear").onclick=()=>speakW(w.en);$("#slow").onclick=()=>speakW(w.en,.55);
    $("#prev").onclick=()=>{if(i>0){i--;show()}};
    $("#next").onclick=()=>{if(i<u.words.length-1){i++;show()}else end()};
    drawMic();speakW(w.en);
  };
  show();
}

/* 2 & 3. Nghe & chọn / Nhìn & chọn */
function optionsFor(target,pool){
  const others=shuffle(pool.filter(w=>w.en!==target.en&&w.pic!==target.pic));
  const uniq=[];for(const w of others){if(!uniq.some(x=>x.en===w.en||x.pic===w.pic))uniq.push(w);if(uniq.length===3)break}
  return shuffle([target,...uniq]);
}
function gChoose(u,L,back,act,opt={}){
  const pool=opt.pool||u.words;
  const rounds=opt.rounds||shuffle(u.words).slice(0,8).map(w=>({w,mode:act}));
  const title=opt.title||(act==="listen"?`👂 Nghe & chọn · ${esc(u.t)}`:`👀 Nhìn & chọn · ${esc(u.t)}`);
  render(shell(title,back,rounds.length));
  let r=0,score=0;
  const show=()=>{
    SAY=[];setProg(r);const {w,mode}=rounds[r];const ops=optionsFor(w,pool);let miss=false,locked=false;
    if(mode==="listen"){
      $("#stage").innerHTML=`<div class="prompt">Nghe và chạm vào hình đúng</div>
       <button class="btn speaker" style="--c:var(--sky)" ${sv(w.en)} aria-label="Nghe lại">🔊</button>
       <div class="grid4">${ops.map((o,k)=>`<button class="tile pic" data-k="${k}">${pic(o.pic)}</button>`).join("")}</div>`;
      say(w.en);
    }else{
      $("#stage").innerHTML=`<div class="prompt">Đây là gì? Chọn từ đúng</div>
       <div class="bigpic">${pic(w.pic)}</div>
       <div class="grid4">${ops.map((o,k)=>`<button class="tile" data-k="${k}">${esc(o.en)}</button>`).join("")}</div>`;
    }
    document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
      if(locked)return;const o=ops[+t.dataset.k];
      if(o.en===w.en){
        locked=true;t.classList.add("good","pop");sGood();if(!miss){score++;$("#gs").textContent=score}
        setTimeout(()=>say(w.en),250);
        if(mode==="listen"){t.innerHTML=`<span>${pic(o.pic)}<br><small style="font-size:1.1rem">${esc(o.en)}</small></span>`}
        else{t.innerHTML=`<span>${pic(o.pic)} ${esc(o.en)}</span>`}
        setTimeout(()=>{r++;r<rounds.length?show():done()},1300);
      }else{miss=true;t.classList.add("bad");bump(t);sBad();if(strictFail(opt.again||(()=>gChoose(u,L,back,act)),`Đáp án đúng: <b>${esc(w.en)}</b> ${pic(w.pic)}`))return;if(mode==="look")say(o.en)}
    });
  };
  const done=()=>{
    if(opt.onEnd)return opt.onEnd(score,rounds.length);
    finish({stars:score,max:rounds.length,back,key:u.key,act,again:()=>gChoose(u,L,back,act)});
  };
  show();
}

/* 4. Lật thẻ ghép đôi */
function gMatch(u,L,back,act){
  const ws=shuffle(u.words).slice(0,6);
  render(shell(`🧩 Lật thẻ · ${esc(u.t)}`,back,ws.length));
  const cards=shuffle(ws.flatMap((w,i)=>[{i,type:"pic"},{i,type:"word"}]));
  let open=[],pairs=0,tries=0,busy=false;
  $("#stage").innerHTML=`<div class="prompt">Lật 2 thẻ: tìm hình và chữ giống nhau</div>
    <div class="mgrid">${cards.map((c,k)=>`<button class="mc" data-k="${k}" aria-label="Thẻ úp">?</button>`).join("")}</div>
    <div class="muted" id="tries">Số lần lật: 0</div>`;
  const face=(el,c)=>{const w=ws[c.i];el.classList.add("open",c.type);el.innerHTML=c.type==="pic"?pic(w.pic):esc(w.en)};
  const hide=el=>{el.className="mc";el.innerHTML="?"};
  document.querySelectorAll(".mc").forEach(el=>el.onclick=()=>{
    const c=cards[+el.dataset.k];
    if(busy||el.classList.contains("open"))return;
    face(el,c);say(ws[c.i].en);open.push([el,c]);
    if(open.length===2){
      tries++;$("#tries").textContent="Số lần lật: "+tries;
      const [[e1,c1],[e2,c2]]=open;
      if(c1.i===c2.i){
        e1.classList.add("done");e2.classList.add("done");open=[];pairs++;sGood();setProg(pairs,false);$("#gs").textContent=pairs;
        if(pairs===ws.length)setTimeout(()=>finish({stars:pairs,max:ws.length,back,key:u.key,act,again:()=>gMatch(u,L,back,act)}),700);
      }else{busy=true;sBad();setTimeout(()=>{hide(e1);hide(e2);open=[];busy=false},950)}
    }
  });
  setProg(0,false);
}

/* 5. Đánh vần */
function gSpell(u,L,back,act){
  const letters=w=>w.en.replace(/[^A-Za-z]/g,"").length;
  let list=u.words.filter(w=>letters(w)<=11);if(list.length<4)list=u.words;
  const ws=shuffle(list).slice(0,6);
  render(shell(`🔤 Đánh vần · ${esc(u.t)}`,back,ws.length));
  let r=0,score=0;
  const show=()=>{
    SAY=[];setProg(r);const w=ws[r],chars=[...w.en];let pos=0,miss=false;
    const need=()=>{while(pos<chars.length&&!/[A-Za-z]/.test(chars[pos]))pos++;return chars[pos]};
    const extra=(u.adv||u.li>=3)?shuffle("abcdefghijklmnoprstuwy".split("").filter(c=>!w.en.toLowerCase().includes(c))).slice(0,u.adv?3:2):[];
    const tiles=shuffle([...chars.filter(c=>/[A-Za-z]/.test(c)).map(c=>c.toLowerCase()),...extra]);
    $("#stage").innerHTML=`<div class="prompt">Xếp chữ cái thành từ <span class="vi">(${esc(w.vi)})</span></div>
      <div class="bigpic" style="width:min(180px,50vw)">${pic(w.pic)}</div>
      <button class="btn sm" style="--c:var(--sky)" ${sv(w.en)}>🔊 Nghe từ</button>
      <div class="slots">${chars.map((c,k)=>/[A-Za-z]/.test(c)?`<span class="slot" data-s="${k}"></span>`:c===" "?`<span class="slot gap"></span>`:`<span class="slot f">${esc(c)}</span>`).join("")}</div>
      <div class="letters">${tiles.map((c,k)=>`<button class="btn lt" data-t="${k}">${c}</button>`).join("")}</div>`;
    say(w.en);need();
    document.querySelectorAll(".lt").forEach(b=>b.onclick=()=>{
      const want=need();if(!want)return;
      if(tiles[+b.dataset.t]===want.toLowerCase()){
        const s=document.querySelector(`[data-s="${pos}"]`);s.textContent=want;s.classList.add("f","pop");b.disabled=true;tone(520+pos*40,.08);pos++;
        if(!need()){sGood();if(!miss){score++;$("#gs").textContent=score}setTimeout(()=>say(w.en),200);setTimeout(()=>{r++;r<ws.length?show():finish({stars:score,max:ws.length,back,key:u.key,act,again:()=>gSpell(u,L,back,act)})},1400)}
      }else{miss=true;bump(b);sBad();strictFail(()=>gSpell(u,L,back,act),`Từ đúng là: <b>${esc(w.en)}</b> ${pic(w.pic)}`)}
    });
  };
  show();
}

/* 6. Xếp câu */
function gSent(u,L,back,act){
  const others=shuffle(LEVELS[u.li].units.filter(x=>x!==u).flatMap(x=>x.sent)).slice(0,2);
  const ss=[...shuffle(u.sent),...others];
  render(shell(`🧱 Xếp câu · ${esc(u.t)}`,back,ss.length));
  let r=0,score=0;
  const show=()=>{
    SAY=[];setProg(r);const s=ss[r],toks=s.en.split(" ");let bank=toks.map((t,k)=>({t,k})),ans=[],miss=false,locked=false;
    do{bank=shuffle(bank)}while(toks.length>1&&bank.map(b=>b.t).join(" ")===s.en);
    const draw=()=>{
      $("#stage").innerHTML=`<div class="prompt">Xếp các từ thành câu đúng</div>
        <div class="vi" style="font-size:1.1rem">“${esc(s.vi)}”</div>
        <button class="btn sm" style="--c:var(--sky)" ${sv(s.en)}>🔊 Nghe câu mẫu</button>
        <div class="ans" id="ans">${ans.length?ans.map((a,k)=>`<button class="btn tok" style="--c:var(--sun)" data-a="${k}">${esc(a.t)}</button>`).join(""):'<span class="muted">Chạm vào các từ bên dưới</span>'}</div>
        <div class="bank">${bank.map((b,k)=>`<button class="btn tok" data-b="${k}">${esc(b.t)}</button>`).join("")}</div>`;
      document.querySelectorAll("[data-b]").forEach(el=>el.onclick=()=>{if(locked)return;const b=bank.splice(+el.dataset.b,1)[0];ans.push(b);tone(600,.06);draw();check()});
      document.querySelectorAll("[data-a]").forEach(el=>el.onclick=()=>{if(locked)return;const a=ans.splice(+el.dataset.a,1)[0];bank.push(a);draw()});
    };
    const check=()=>{
      if(bank.length)return;
      if(ans.map(a=>a.t).join(" ")===s.en){locked=true;$("#ans").classList.add("good");sGood();if(!miss){score++;$("#gs").textContent=score}say(s.en);
        setTimeout(()=>{r++;r<ss.length?show():finish({stars:score,max:ss.length,back,key:u.key,act,again:()=>gSent(u,L,back,act)})},2200)}
      else{miss=true;sBad();bump($("#ans"));if(strictFail(()=>gSent(u,L,back,act),`Câu đúng là: <b>${esc(s.en)}</b>`))return;toast("Chưa đúng rồi, chạm vào từ để đổi chỗ nhé!",1800)}
    };
    draw();
  };
  show();
}

/* ===== Nghe giọng bé (dictation) ===== */
/* Micrô của trình duyệt (Web Speech API), cùng cách gọi như dictation của Claude.
   Dùng khi phần mềm chạy ngoài claude.ai: Chrome, Edge, Safari (iPhone/iPad). */
function makeBrowserSR(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  let rec=null,state="idle",lastReason="stopped";const fH=[],pH=[],sH=[];
  const emit=(arr,e)=>arr.slice().forEach(f=>{try{f(e)}catch(_){}});
  const setState=(s,reason)=>{state=s;emit(sH,reason?{state:s,reason}:{state:s})};
  const sub=(arr,f)=>{arr.push(f);return()=>{const k=arr.indexOf(f);if(k>=0)arr.splice(k,1)}};
  const MAP={"not-allowed":"not_granted","service-not-allowed":"not_granted","audio-capture":"not_granted","network":"upstream_error","language-not-supported":"unavailable","aborted":"stopped","no-speech":"stopped"};
  return{
    start(opts){return new Promise((res,rej)=>{
      if(state!=="idle"){res();return}
      try{rec=new SR()}catch(e){rej({code:"unavailable",message:String(e)});return}
      rec.lang=(opts&&/^vi/.test(opts.language||""))?"vi-VN":"en-US";rec.continuous=true;rec.interimResults=true;
      let started=false,err=null,first=true;
      rec.onstart=()=>{started=true;setState("listening");res()};
      rec.onresult=ev=>{let interim="";for(let k=ev.resultIndex;k<ev.results.length;k++){const r=ev.results[k];
        if(r.isFinal){emit(fH,{text:(first?"":" ")+r[0].transcript.trim()});first=false}else interim+=r[0].transcript}
        emit(pH,{text:interim.trim()})};
      rec.onerror=ev=>{err=MAP[ev.error]||"upstream_error"};
      rec.onend=()=>{const reason=err||lastReason;lastReason="stopped";rec=null;setState("idle",reason);if(!started)rej({code:reason,message:"ended"})};
      setState("starting");
      try{rec.start()}catch(e){rec=null;setState("idle","upstream_error");rej({code:"upstream_error",message:String(e)})}
    })},
    stop(){return new Promise(res=>{if(!rec){res();return}const off=sub(sH,e=>{if(e.state==="idle"){off();res()}});try{rec.stop()}catch(e){off();res()}})},
    active(){return state!=="idle"},
    onFinal:f=>sub(fH,f),onPartial:f=>sub(pH,f),
    onState(f){const un=sub(sH,f);if(state!=="idle")setTimeout(()=>f({state}),0);return un}
  };
}
const BSR=makeBrowserSR();
let DICT=BSR,DICT_OFF=false;
try{if(window.claude&&window.claude.use)window.claude.use("dictation").then(d=>{if(d){DICT=d;DICT_OFF=false}}).catch(()=>{})}catch(e){}
const dstop=()=>{try{if(DICT&&DICT.active())DICT.stop().catch(()=>{})}catch(e){}};
const NUMW={"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve"};
const CONTR={"i'm":"i am","it's":"it is","what's":"what is","i'd":"i would","can't":"can not","cannot":"can not","let's":"let us","don't":"do not","she's":"she is","he's":"he is","that's":"that is","vietnam":"viet nam"};
const HOMO={to:"two",too:"two",for:"four",ate:"eight",won:"one",sea:"see",right:"write",son:"sun",high:"hi",mom:"mum",favorite:"favourite",color:"colour",pair:"pear",ok:"okay"};
function normTok(s){
  const out=[];String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).forEach(t=>{
    t=t.replace(/^'+|'+$/g,"");if(!t)return;
    (CONTR[t]||t).split(" ").forEach(x=>{x=x.replace(/'/g,"");x=NUMW[x]||HOMO[x]||x;if(x)out.push(x)});
  });return out}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
const fuzzyIn=(t,hs)=>hs.some(h=>h===t||(t.length>=4&&lev(t,h)<=1)||(t.length>=7&&lev(t,h)<=2));
function matchOK(target,text){const tt=normTok(target),ht=normTok(text);if(!tt.length||!ht.length)return false;
  const f=tt.filter(t=>fuzzyIn(t,ht)).length;return tt.length<=4?f===tt.length:f/tt.length>=.85}

/* 10. Nói theo: máy đọc, bé nói đúng mới qua */
function gSpeak(u,L,back,act){
  const items=u.li===0?shuffle(u.words).slice(0,6):[...shuffle(u.words).slice(0,3),...u.sent];
  render(shell(`🎙️ Nói theo · ${esc(u.t)}`,back,items.length));
  let r=0,score=0;
  const next=()=>{r++;r<items.length?show():finish({stars:score,max:items.length,back,key:u.key,act,again:()=>gSpeak(u,L,back,act)})};
  const show=()=>{
    SAY=[];setProg(r);const it=items[r];let tries=0,passed=false,subs=[],silenceT,maxT,heard="",partial="";
    const cleanup=()=>{subs.forEach(f=>{try{f()}catch(e){}});subs=[];clearTimeout(silenceT);clearTimeout(maxT)};
    stopMedia=()=>{cleanup();dstop();try{speechSynthesis.cancel()}catch(e){}};
    $("#stage").innerHTML=`<div class="prompt">Nghe Cú Bông đọc, rồi bé nói theo. Nói đúng mới qua câu tiếp!</div>
      ${it.pic?`<div class="bigpic" style="width:min(150px,40vw);font-size:4.5rem">${pic(it.pic)}</div>`:""}
      <div class="speakline" id="sl">${raHTML(it.en)}</div><div class="vi">${esc(it.vi)}</div>
      <div class="row" style="justify-content:center"><button class="btn sm" style="--c:var(--sky)" id="rep">🔊 Nghe lại</button><button class="btn sm" style="--c:var(--leaf)" id="slw">🐢 Nghe chậm</button></div>
      <div id="ctl" class="row" style="justify-content:center"></div>
      <div class="heard" id="heard"></div>`;
    const sl=$("#sl"),heardEl=$("#heard"),ctl=$("#ctl");
    const read=rate=>{if(DICT&&DICT.active())return;readAlong(sl,it.en,rate)};
    $("#rep").onclick=()=>read(.85);$("#slw").onclick=()=>read(.55);
    const paint=text=>{const ht=normTok(text);sl.querySelectorAll(".rw").forEach(s=>{const tk=normTok(s.textContent);s.classList.toggle("hit",tk.length>0&&tk.every(t=>fuzzyIn(t,ht)))})};
    const success=()=>{if(passed)return;passed=true;cleanup();dstop();
      sGood();score++;$("#gs").textContent=score;sl.querySelectorAll(".rw").forEach(s=>s.classList.add("hit"));
      heardEl.innerHTML=`<b class="okmsg">🎉 Đúng rồi! Giỏi quá!</b>`;ctl.innerHTML="";
      setTimeout(()=>say(["Great!","Well done!","Excellent!","Super!"][Math.random()*4|0],.95),300);
      setTimeout(next,1900)};
    const failed=()=>{tries++;sBad();bump(sl);const t=(heard+" "+partial).trim();
      heardEl.innerHTML=t?`Cú Bông nghe được: “${esc(t)}”<br>Gần đúng rồi, bé nghe lại rồi nói lại nhé!`:`Cú Bông chưa nghe thấy gì. Bé nói to và rõ hơn nhé!`;drawCtl()};
    const drawCtl=()=>{
      const skip=tries>=3?`<button class="btn sm ghost" id="skip">Bỏ qua câu này</button>`:"";
      if(DICT&&!DICT_OFF){ctl.innerHTML=`<button class="btn big mic" id="mic" style="--c:var(--berry)">🎙️ ${tries?"Bé nói lại":"Đến lượt bé nói"}</button>${skip}`;$("#mic").onclick=listen}
      else{ctl.innerHTML=`<button class="btn big" style="--c:var(--leaf)" id="okp">✓ Bé nói đúng rồi</button>${skip}<div class="muted" style="flex-basis:100%;font-size:.9rem">Thiết bị này chưa nghe được giọng bé. Phụ huynh nghe bé nói, đúng thì bấm ✓.</div>`;$("#okp").onclick=success}
      const sk=$("#skip");if(sk)sk.onclick=()=>{cleanup();dstop();next()};
    };
    const upd=()=>{const t=(heard+" "+partial).trim();heardEl.textContent=t?`🎧 “${t}”`:"Cú Bông đang nghe…";paint(t);
      if(matchOK(it.en,t))return success();clearTimeout(silenceT);if(t)silenceT=setTimeout(dstop,2200)};
    const listen=()=>{
      if(DICT.active()){dstop();return}
      let p;try{p=DICT.start({language:"en"})}catch(e){DICT_OFF=true;drawCtl();return}
      try{speechSynthesis.cancel()}catch(e){}
      cleanup();heard="";partial="";
      subs.push(DICT.onFinal(e=>{heard+=e.text;upd()}),DICT.onPartial(e=>{partial=e.text;upd()}),DICT.onState(e=>{
        const m=$("#mic");
        if(e.state==="listening"&&m){m.classList.add("on");m.textContent="🔴 Bé đang nói… (chạm để dừng)";heardEl.textContent="Cú Bông đang nghe…"}
        if(e.state==="idle"){cleanup();if(passed)return;
          if(matchOK(it.en,heard+" "+partial))return success();
          if(e.reason==="not_granted"||e.reason==="unavailable"){DICT_OFF=true;drawCtl();return}
          if(e.reason==="rate_limited"||e.reason==="upstream_error"){toast("Micrô đang bận, bé thử lại sau chút nhé!");drawCtl();return}
          if(e.reason==="stopped"||e.reason==="viewer_stopped"||e.reason==="time_limit")return failed();
          drawCtl()}
      }));
      p.catch(err=>{const c=err&&err.code;
        if(c==="dismissed")toast("Bé bấm lại 🎙️ và chọn Cho phép để Cú Bông nghe được nhé!",3200);
        else if(c==="not_granted"||c==="unavailable"){DICT_OFF=true;toast("Chưa dùng được micrô, chuyển sang để phụ huynh chấm.",3200);drawCtl()}
        else if(c!=="stopped")drawCtl()});
      maxT=setTimeout(dstop,12000);
    };
    drawCtl();setTimeout(()=>read(.85),350);
  };
  show();
}

/* 7. Xem & hát: video hoạt hình tự chạy, đọc từng từ */
function gVideo(u,L,back,act){
  const spellable=w=>u.li>=1&&/^[A-Za-z]{2,8}$/.test(w.en);
  const scenes=[{type:"intro"},...u.words.map(w=>({type:"word",w})),...u.sent.map(s=>({type:"sent",s})),{type:"outro"}];
  render(shell(`🎬 Xem & hát · ${esc(u.t)}`,back,scenes.length));
  const cols=["--sun","--berry","--leaf","--sky","--orange","--grape"];
  let cur=0,run=0,playing=false;
  $("#stage").innerHTML=`<div class="tv" id="tv"><div class="scene" id="scene"></div><div class="tvcap" id="cap">Bấm ▶ Xem để bắt đầu, rồi hát theo nhé!</div></div>
   <div class="row" style="justify-content:center"><button class="btn big" id="play" style="--c:var(--leaf)">▶ Xem</button><button class="btn ghost" id="restart">⟲ Từ đầu</button></div>`;
  const tv=$("#tv"),sc=$("#scene");
  const deco=()=>shuffle(u.words).slice(0,5).map((w,i)=>`<span class="deco" style="left:${4+i*19}%;top:${i%2?10:72}%;animation-delay:-${i}s">${pic(w.pic)}</span>`).join("");
  const draw=i=>{const s=scenes[i];setProg(i);tv.style.setProperty("--scene",`var(${cols[i%cols.length]})`);
    if(s.type==="intro")sc.innerHTML=deco()+`<div class="sp">${u.em}</div><div class="sw">${esc(u.t)}</div><div class="sv">${esc(u.vi)}</div>`;
    else if(s.type==="word"){const w=s.w;sc.innerHTML=`<div class="sp">${pic(w.pic)}</div><div class="sw">${spellable(w)?[...w.en].map((c,k)=>`<span class="lk" style="animation-delay:${1.3+k*.45}s">${esc(c)}</span>`).join(""):esc(w.en)}</div><div class="sv">${esc(w.vi)}</div>`}
    else if(s.type==="sent")sc.innerHTML=`<div class="sp" style="font-size:clamp(3rem,10vw,5rem)">🎤</div><div class="sw" style="font-size:clamp(1.3rem,4.6vw,2.2rem);text-align:center">${raHTML(s.s.en)}</div><div class="sv">${esc(s.s.vi)}</div>`;
    else sc.innerHTML=deco()+`<div class="sp">🦉</div><div class="sw">Great job!</div><div class="sv">Giỏi lắm! Bé xem hết rồi!</div>`;
  };
  const lines=s=>s.type==="intro"?[[`Let's learn ${u.t}!`,.9]]
    :s.type==="word"?(spellable(s.w)?[[s.w.en,.8],[[...s.w.en.toUpperCase()].join(", "),.75],[s.w.en+"!",.85]]:[[s.w.en,.8],[s.w.en,.6]])
    :s.type==="sent"?[[s.s.en,.8],[s.s.en,.7]]:[["Great job! Bye bye!",.9]];
  const stop=()=>{run++;playing=false;try{speechSynthesis.cancel()}catch(e){}};
  stopMedia=stop;
  const playFrom=async()=>{const my=++run;playing=true;
    while(cur<scenes.length){draw(cur);$("#cap").textContent=scenes[cur].type==="intro"?"🎵 Cùng xem nào!":scenes[cur].type==="outro"?"🎉 Hết rồi!":"🗣️ Bé hãy nói to theo nhé!";
      for(const [t,r] of lines(scenes[cur])){await (scenes[cur].type==="sent"?readAlong(sc.querySelector(".sw"),t,r):sayP(t,r));if(my!==run)return;await wait(250);if(my!==run)return}
      await wait(500);if(my!==run)return;cur++}
    playing=false;finish({stars:3,back,key:u.key,act,again:()=>gVideo(u,L,back,act),label:"Xem hết video! Bé được"});
  };
  $("#play").onclick=()=>{if(playing){stop();$("#play").textContent="▶ Xem tiếp"}else{$("#play").textContent="⏸ Tạm dừng";playFrom()}};
  $("#restart").onclick=()=>{stop();cur=0;$("#play").textContent="⏸ Tạm dừng";playFrom()};
  draw(0);
}

      else{sBad();bump(el);if(strictFail(()=>gTF(u,L,back,act),`Hình này là <b>${esc(w.en)}</b> ${pic(w.pic)}`))return;$("#fb").textContent=ok?`Hình này đúng là “${w.en}” đó!`:`Chưa đúng. Hình này là “${w.en}”.`}

}

  const showText=u.li>=1&&!hardMode(u);
  const end=()=>{clearAll();finish({stars:score,max:rounds.length,back,key:u.key,act,again:()=>gWhack(u,L,back,act)})};
  const nextRound=ms=>timers.push(setTimeout(()=>{r++;r<rounds.length?round():end()},ms));
  const round=()=>{
    clearAll();setProg(r);const w=rounds[r],ops=optionsFor(w,u.words);let miss=false,done=false;
    $("#stage").innerHTML=`<div class="prompt" id="wp">Đập chú chuột cầm hình ${showText?`<b>“${esc(w.en)}”</b>`:"bé vừa nghe"} <button class="btn sm" style="--c:var(--sky)" id="rep" aria-label="Nghe lại">🔊</button></div>
      <div class="field">${Array.from({length:9},(_,k)=>`<div class="hole" data-h="${k}"></div>`).join("")}</div>`;
    $("#rep").onclick=()=>say(w.en);say(w.en);
    const holes=[...document.querySelectorAll(".hole")];
    const life=Math.max(1150,2100-r*90-(u.adv?300:0)-u.li*70);
    const spawn=()=>{
      if(done||!alive)return;const free=holes.filter(h=>!h.firstChild);if(!free.length)return;
      const h=free[Math.random()*free.length|0];
      const targetUp=holes.some(x=>x.firstChild&&x.firstChild.dataset.t==="1");
      const o=(!targetUp&&Math.random()<.55)?w:(shuffle(ops.filter(x=>x!==w))[0]||w);
      const m=document.createElement("button");m.className="mole";m.dataset.t=o===w?"1":"0";m.setAttribute("aria-label","Chú chuột");
      m.innerHTML=`<span class="mp">${pic(o.pic)}</span><span class="mf">🐭</span>`;
      m.onclick=()=>{
        if(done)return;
        if(m.dataset.t==="1"){done=true;m.classList.add("bonk");tone(260,.08,"square",0,.15);sGood();
          if(!miss){score++;$("#gs").textContent=score}say(w.en);nextRound(1100)}
        else{miss=true;m.classList.add("ouch");sBad();if(strictFail(()=>gWhack(u,L,back,act),`Bé cần đập chuột cầm hình <b>${esc(w.en)}</b> ${pic(w.pic)}`))return;timers.push(setTimeout(()=>m.remove(),300))}
      };
      h.appendChild(m);timers.push(setTimeout(()=>{if(m.isConnected&&!m.classList.contains("bonk"))m.remove()},life));
    };
    spawn();timers.push(setInterval(spawn,Math.round(life*.5)));
    timers.push(setTimeout(()=>{if(done)return;done=true;
      if(strictFail(()=>gWhack(u,L,back,act),`Hết giờ! Từ đó là <b>${esc(w.en)}</b> ${pic(w.pic)}`))return;
      $("#wp").innerHTML=`Hết giờ! Từ đó là <b>${esc(w.en)}</b> ${pic(w.pic)}`;say(w.en);nextRound(1900)},15000));
  };
  round();
}

/* 12. Đua xe với Cú Bông */
function gRace(u,L,back,act){
  render(shell(`🏎️ Đua xe · ${esc(u.t)}`,back,1));
  let me=0,bot=0,score=0,over=false,tick=null,prev=null,timers=[];
  const botStep=[.36,.43,.5,.57,.64,.72][u.li]+(u.adv?.1:0);
  stopMedia=()=>{over=true;clearInterval(tick);timers.forEach(clearTimeout)};
  $("#stage").innerHTML=`
    <div class="track">
      <div class="lane"><span class="who">${P().avatar} ${esc(P().name)}</span><span class="car" id="cme">🏎️</span><span class="flag">🏁</span></div>
      <div class="lane"><span class="who">🦉 Cú Bông</span><span class="car" id="cbot">🚙</span><span class="flag">🏁</span></div>
    </div>
    <div id="q" class="stage" style="margin-top:0;width:100%"><div class="prompt">Trả lời đúng thì xe của bé chạy lên. Về đích trước Cú Bông là thắng!</div>
      <button class="btn big" style="--c:var(--leaf)" id="go">🚦 Bắt đầu đua!</button></div>`;
  const pos=()=>{$("#cme").style.setProperty("--p",Math.min(me,100));$("#cbot").style.setProperty("--p",Math.min(bot,100))};
  const end=win=>{if(over)return;over=true;clearInterval(tick);
    if(win){sWin()}
    timers.push(setTimeout(()=>finish({stars:win?5:Math.min(4,Math.floor(score/2)),max:5,back,key:u.key,act,again:()=>gRace(u,L,back,act),label:win?"🏆 Bé về đích trước! Bé được":"Cú Bông về trước rồi. Bé được"}),900))};
  const ask=()=>{
    if(over)return;
    let w;do{w=u.words[Math.random()*u.words.length|0]}while(u.words.length>1&&w===prev);prev=w;
    const ops=shuffle([w,...optionsFor(w,u.words).filter(o=>o!==w).slice(0,2)]);
    const listen=u.li===0||Math.random()<.4;
    $("#q").innerHTML=listen
      ?`<div class="prompt">Nghe và chọn hình đúng <button class="btn sm" style="--c:var(--sky)" id="rep">🔊</button></div><div class="grid3">${ops.map((o,k)=>`<button class="tile pic" data-k="${k}">${pic(o.pic)}</button>`).join("")}</div>`
      :`<div class="prompt">Đây là gì?</div><div class="bigpic" style="width:min(130px,34vw);font-size:4rem">${pic(w.pic)}</div><div class="grid3">${ops.map((o,k)=>`<button class="tile" data-k="${k}" style="font-size:1.1rem;min-height:70px">${esc(o.en)}</button>`).join("")}</div>`;
    if(listen){say(w.en);$("#rep").onclick=()=>say(w.en)}
    let locked=false;
    document.querySelectorAll("#q .tile").forEach(t=>t.onclick=()=>{
      if(locked||over)return;locked=true;const o=ops[+t.dataset.k];
      if(o===w){t.classList.add("good");sGood();score++;$("#gs").textContent=score;me+=12.5;pos();
        if(me>=100)return end(true);timers.push(setTimeout(ask,450))}
      else{t.classList.add("bad");bump(t);sBad();if(strictFail(()=>gRace(u,L,back,act),`Đáp án đúng: <b>${esc(w.en)}</b> ${pic(w.pic)}`))return;say(w.en);timers.push(setTimeout(ask,1000))}
    });
  };
  $("#go").onclick=()=>{
    let n=3;$("#q").innerHTML=`<div class="count" id="cd">3</div>`;tone(440,.15);
    const cd=setInterval(()=>{n--;if(over){clearInterval(cd);return}
      if(n>0){$("#cd").textContent=n;tone(440,.15)}
      else{clearInterval(cd);tone(880,.3);ask();tick=setInterval(()=>{if(over)return;bot+=botStep;pos();if(bot>=100)end(false)},300)}},800);
  };
  pos();
}

/* 13. Chữ cái bị mất */
function gMissing(u,L,back,act){
  let list=u.words.filter(w=>w.en.replace(/[^A-Za-z]/g,"").length>=3);if(!list.length)list=u.words;
  const rounds=shuffle(list).slice(0,8);
  render(shell(`🔡 Chữ cái bị mất · ${esc(u.t)}`,back,rounds.length));
  let r=0,score=0;
  const show=()=>{
    SAY=[];setProg(r);const w=rounds[r],chars=[...w.en];
    const idx=chars.map((c,k)=>/[A-Za-z]/.test(c)?k:-1).filter(k=>k>=0);
    const nb=hardMode(u)&&idx.length>=5?2:1;
    const blanks=shuffle(idx).slice(0,nb).sort((a,b)=>a-b);let cur=0,miss=false;
    const draw=()=>{
      $("#stage").innerHTML=`<div class="prompt">Chữ cái nào còn thiếu? <span class="vi">(${esc(w.vi)})</span></div>
        <div class="bigpic" style="width:min(170px,46vw)">${pic(w.pic)}</div>
        <button class="btn sm" style="--c:var(--sky)" ${sv(w.en)}>🔊 Nghe từ</button>
        <div class="slots">${chars.map((c,k)=>c===" "?`<span class="slot gap"></span>`:blanks.includes(k)&&blanks.indexOf(k)>=cur?`<span class="slot ${blanks[cur]===k?"now":""}">?</span>`:`<span class="slot f">${esc(c)}</span>`).join("")}</div>
        <div class="letters" id="opts"></div>`;
      const want=chars[blanks[cur]].toLowerCase();
      const opts=shuffle([want,...shuffle("abcdefghijklmnopqrstuvwxyz".split("").filter(c=>c!==want)).slice(0,3)]);
      $("#opts").innerHTML=opts.map(c=>`<button class="btn lt" data-c="${c}">${c}</button>`).join("");
      document.querySelectorAll("#opts .lt").forEach(b=>b.onclick=()=>{
        if(b.dataset.c===want){tone(560,.08);cur++;
          if(cur<blanks.length)return draw();
          draw();sGood();if(!miss){score++;$("#gs").textContent=score}say(w.en);
          document.querySelectorAll("#opts .lt").forEach(x=>x.disabled=true);
          setTimeout(()=>{r++;r<rounds.length?show():finish({stars:score,max:rounds.length,back,key:u.key,act,again:()=>gMissing(u,L,back,act)})},1400);
        }else{miss=true;bump(b);sBad();b.disabled=true;strictFail(()=>gMissing(u,L,back,act),`Từ đúng là: <b>${esc(w.en)}</b> ${pic(w.pic)}`)}
      });
    };
    draw();say(w.en);
  };
  show();
}

/* 14. Tìm từ ẩn */
function gWsearch(u,L,back,act){
  const hard=hardMode(u),N=hard?9:7;
  const cand=shuffle(u.words.filter(w=>/^[A-Za-z]+$/.test(w.en)&&w.en.length<=N&&w.en.length>=2));
  const dirs=hard?[[0,1],[1,0],[1,1]]:[[0,1],[1,0]];
  const grid=Array.from({length:N},()=>Array(N).fill(""));const placed=[];
  for(const w of cand){
    if(placed.length>=(hard?6:5))break;const s=w.en.toUpperCase();
    for(let t=0;t<200;t++){
      const [dr,dc]=dirs[Math.random()*dirs.length|0];
      const r0=Math.random()*(N-(dr?s.length:1)+1)|0,c0=Math.random()*(N-(dc?s.length:1)+1)|0;
      let ok=true;for(let k=0;k<s.length;k++){const g=grid[r0+dr*k][c0+dc*k];if(g&&g!==s[k]){ok=false;break}}
      if(!ok)continue;const cells=[];
      for(let k=0;k<s.length;k++){grid[r0+dr*k][c0+dc*k]=s[k];cells.push((r0+dr*k)*N+c0+dc*k)}
      placed.push({w,cells,found:false});break;
    }
  }
  if(!placed.length){toast("Bài này chưa có từ phù hợp cho trò Tìm từ ẩn.");return go(back)}
  const AL="ABCDEFGHIKLMNOPRSTUWY";
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(!grid[i][j])grid[i][j]=AL[Math.random()*AL.length|0];
  render(shell(`🔎 Tìm từ ẩn · ${esc(u.t)}`,back,placed.length));
  let start=null,score=0;
  $("#stage").innerHTML=`<div class="prompt">Chạm chữ cái <b>đầu</b> rồi chữ cái <b>cuối</b> của từ.${hard?" Từ có thể nằm ngang, dọc hoặc chéo.":" Từ nằm ngang hoặc dọc."}</div>
    <div class="wlist" id="wl"></div>
    <div class="ws" style="--n:${N}">${grid.flat().map((c,k)=>`<button class="wc" data-i="${k}">${c}</button>`).join("")}</div>
    <button class="btn sm ghost" id="hint">💡 Gợi ý</button>`;
  const cells=[...document.querySelectorAll(".wc")];
  const drawList=()=>{$("#wl").innerHTML=placed.map(p=>`<span class="wchip ${p.found?"done":""}"><span class="p">${pic(p.w.pic)}</span>${hard&&!p.found?esc(p.w.vi):esc(p.w.en)}</span>`).join("")};
  drawList();
  const line=(a,b)=>{const r1=a/N|0,c1=a%N,r2=b/N|0,c2=b%N,dr=Math.sign(r2-r1),dc=Math.sign(c2-c1);
    if(!(r1===r2||c1===c2||Math.abs(r2-r1)===Math.abs(c2-c1)))return null;
    const n=Math.max(Math.abs(r2-r1),Math.abs(c2-c1));return Array.from({length:n+1},(_,k)=>(r1+dr*k)*N+c1+dc*k)};
  const clearSel=()=>cells.forEach(c=>c.classList.remove("sel"));
  cells.forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i;
    if(start===null){start=i;clearSel();el.classList.add("sel");tone(500,.05);return}
    if(i===start){start=null;clearSel();return}
    const path=line(start,i);start=null;
    if(path){path.forEach(k=>cells[k].classList.add("sel"))}
    const key=path&&path.join(","),rkey=path&&[...path].reverse().join(",");
    const hit=path&&placed.find(p=>!p.found&&(p.cells.join(",")===key||p.cells.join(",")===rkey));
    setTimeout(()=>{clearSel();
      if(hit){hit.found=true;hit.cells.forEach(k=>cells[k].classList.add("found"));sGood();score++;$("#gs").textContent=score;setProg(score,false);say(hit.w.en);drawList();
        if(placed.every(p=>p.found))setTimeout(()=>finish({stars:score,max:placed.length,back,key:u.key,act,again:()=>gWsearch(u,L,back,act)}),1200)}
      else{sBad()}},hit?50:350);
  });
  $("#hint").onclick=()=>{const p=placed.find(x=>!x.found);if(!p)return;const c=cells[p.cells[0]];c.classList.remove("hint");void c.offsetWidth;c.classList.add("hint");say(p.w.en)};
  setProg(0,false);
}

/* Thử thách cuối đảo */
function challenge(li,adv=false){

  const all=(adv?advUnits(L):basicUnits(L)).flatMap(u=>u.words);
  const rounds=shuffle(all).slice(0,10).map((w,k)=>({w,mode:k%2?"look":"listen"}));
  const back="lv-"+li;
  gChoose({t:L.name,words:all,li},L,back,"listen",{again:()=>challenge(li,adv),pool:all,rounds,title:`🏆 Thử thách ${adv?"nâng cao":"đảo"} ${L.name}`,onEnd:(score,n)=>{
    const p=P(),k=L.id+(adv?"-cupnc":"-cup");p.done[k]=Math.max(p.done[k]||0,score);save();

  }});
}

/* ---------- đọc dữ liệu ---------- */
VLEVELS.forEach((L,li)=>L.units.forEach((u,ui)=>{
  u.li=li;u.ui=ui;u.key="tv-"+li+"-"+ui;
  const sp=(s,f)=>s?s.split(";").map(x=>f(x.split("|").map(y=>y.trim()))):null;
  u.letters=sp(u.L,([ch,name,pic,ex])=>({ch,name,pic,ex}));
  u.ghep=sp(u.G,([w,am,van,thanh,pic])=>({w,am,van,thanh,pic}));
  u.words=sp(u.W,([w,pic])=>({w,pic}))||(u.ghep?u.ghep.map(g=>({w:g.w,pic:g.pic})):null);
  u.ct=sp(u.C,([q,a,wr,pic])=>({q,a,wrong:wr.split(","),pic:pic||""}));
  u.quiz=sp(u.Q,([q,a,...wr])=>({q,a,wrong:wr}));
  if(u.S)u.sort={cats:u.S.cats,items:sp(u.S.items,([w,c])=>({w,c:+c}))};
  if(u.P)u.pairs={label:u.P.label,items:sp(u.P.items,([a,b])=>({a,b}))};
  u.sents=u.X||null;
}));

/* ---------- giọng đọc tiếng Việt ---------- */
let viVoice=null,CTTS=null,warnedVi=false;
function pickViVoice(){try{const vs=speechSynthesis.getVoices();viVoice=vs.find(v=>/^vi/i.test(v.lang)&&/natural|online|hoaimy|namminh/i.test(v.name))||vs.find(v=>/^vi/i.test(v.lang))||null}catch(e){}}
if("speechSynthesis" in window){pickViVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener("voiceschanged",pickViVoice)}
try{if(window.claude&&window.claude.use)window.claude.use("tts").then(t=>{CTTS=t}).catch(()=>{})}catch(e){}
function sayViP(text,rate=.9){return new Promise(res=>{
  let done=false;const fin=()=>{if(!done){done=true;res()}};const t=setTimeout(fin,1600+text.length*110/rate);
  const viaBrowser=v=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="vi-VN";if(v)u.voice=v;u.rate=rate;
    u.onend=()=>{clearTimeout(t);setTimeout(fin,100)};u.onerror=()=>{clearTimeout(t);fin()};setTimeout(()=>speechSynthesis.speak(u),40)}catch(e){fin()}};
  if(!viVoice)pickViVoice();
  if(viVoice)return viaBrowser(viVoice);
  if(CTTS){try{speechSynthesis.cancel()}catch(e){}
    CTTS.speak(text,{language:"vi",rate:Math.max(.7,Math.min(1.5,rate))}).then(()=>{clearTimeout(t);fin()}).catch(()=>{clearTimeout(t);fin()});return}
  if(!warnedVi){warnedVi=true;toast("Máy này chưa có giọng đọc tiếng Việt. Hãy mở bằng Edge, Safari hoặc Chrome trên Android, hoặc cài giọng Tiếng Việt trong cài đặt của máy.",4800)}
  clearTimeout(t);fin();
})}
const sayVi=(t,r)=>{sayViP(t,r)};
const stopVi=()=>{try{CTTS&&CTTS.stop()}catch(e){}};

/* ---------- tiện ích ---------- */
const TONES=[{n:"ngang",m:"",ex:"a"},{n:"huyền",m:"̀",ex:"à"},{n:"sắc",m:"́",ex:"á"},{n:"hỏi",m:"̉",ex:"ả"},{n:"ngã",m:"̃",ex:"ã"},{n:"nặng",m:"̣",ex:"ạ"}];
const toneOf=s=>{const d=s.normalize("NFD");for(const t of TONES.slice(1))if(d.includes(t.m))return t.n;return "ngang"};
const stripTone=s=>s.normalize("NFD").replace(/[̣̀́̉̃]/g,"").normalize("NFC");
const normVi=s=>String(s).toLowerCase().normalize("NFC").replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(Boolean);
function vMatchOK(target,text){const tt=normVi(target),ht=normVi(text);if(!tt.length||!ht.length)return false;
  const f=tt.filter(t=>ht.includes(t)).length;return tt.length<=4?f===tt.length:f/tt.length>=.8}
function pickOpts(a,pool,n=4){const o=[];for(const x of shuffle(pool))if(x!==a&&!o.includes(x)){o.push(x);if(o.length===n-1)break}return shuffle([a,...o])}
const vLevelPool=(u,k)=>VLEVELS[u.li].units.flatMap(x=>x[k]||[]);
const fillBlank=q=>esc(q).replace("_",'<span class="blank">___</span>');
const plainQ=q=>q.replace(/[«»]/g,"").replace(/_/g," chỗ trống ");
const vBack=u=>u.back||`tv-u-${u.li}-${u.ui}`;
const letterHTML=ch=>`<span class="vlt">${esc(ch)}</span>`;
const cycle=(arr,n)=>{let out=[];while(out.length<n&&arr.length)out=out.concat(shuffle(arr));return out.slice(0,n)};

/* ---------- câu hỏi trắc nghiệm chung (đua xe, thử thách) ---------- */
function vMcq(u){
  const q=[];
  if(u.letters){const pool=vLevelPool(u,"letters").map(x=>x.ch);
    u.letters.forEach(l=>q.push({q:`<div class="vbig">${esc(l.ch.toUpperCase())}</div><div class="prompt">Chữ in hoa này là chữ thường nào?</div>`,a:l.ch,opts:pickOpts(l.ch,pool),render:letterHTML,say:"chữ "+l.name}))}
  else if(u.words){const pool=vLevelPool(u,"words");
    u.words.forEach(w=>q.push({q:`<div class="bigpic" style="width:min(150px,40vw);font-size:4.4rem">${w.pic}</div><div class="prompt">Đây là gì?</div>`,a:w.w,opts:pickOpts(w.w,pool.filter(x=>x.pic!==w.pic||x.w===w.w).map(x=>x.w)),after:w.w}))}
  (u.ct||[]).forEach(c=>q.push({q:`${c.pic?`<div class="vpic">${c.pic}</div>`:""}<div class="vq">${fillBlank(c.q)}</div>`,a:c.a,opts:shuffle([c.a,...c.wrong]),after:c.q.replace("_",c.a),say:plainQ(c.q)}));
  if(u.sort)u.sort.items.forEach(it=>q.push({q:`<div class="vq">«<b>${esc(it.w)}</b>» thuộc nhóm nào?</div>`,a:u.sort.cats[it.c],opts:u.sort.cats.slice(),after:it.w,basket:1}));
  (u.quiz||[]).forEach(z=>q.push({q:`<div class="vq">${fillBlank(z.q)}</div>`,a:z.a,opts:shuffle([z.a,...z.wrong]),say:plainQ(z.q)}));
  if(u.pairs){const bs=u.pairs.items.map(x=>x.b);
    u.pairs.items.forEach(p=>q.push({q:`<div class="vq">Từ nào ${esc(u.pairs.label)} «<b>${esc(p.a)}</b>»?</div>`,a:p.b,opts:pickOpts(p.b,bs),say:`Từ nào ${u.pairs.label} ${p.a}`}))}
  return q;
}
const VA={

 noi:{n:"Lật thẻ ghép đôi",em:"🧩",lv:2,d:"Tìm các cặp đi với nhau"},
 chuot:{n:"Đập chuột",em:"🔨",lv:2,d:"Nghe rồi đập đúng chú chuột"},
 dau:{n:"Thêm dấu thanh",em:"〽️",lv:2,d:"Chọn dấu đúng cho tiếng"},
 ghep:{n:"Ghép tiếng",em:"🔤",lv:2,d:"Ghép âm đầu, vần, dấu thành tiếng"},

 dua:{n:"Đua xe",em:"🏎️",lv:3,d:"Trả lời nhanh, thắng Cú Bông"}
};
function vActs(u){
  if(u._acts)return u._acts;const a=[],has=x=>x&&x.length;
  if(has(u.letters)||has(u.words))a.push("the","nghe");
  if(has(u.letters)||has(u.words)||u.pairs)a.push("noi");
  if(has(u.letters)||has(u.words))a.push("chuot");
  if(u.T)a.push("dau");if(has(u.ghep))a.push("ghep");if(has(u.ct))a.push("dien");if(u.sort)a.push("loai");
  if(has(u.quiz)||u.pairs)a.push("trac");if(has(u.sents))a.push("xep");
  if(u.li>0&&(has(u.words)||has(u.sents)))a.push("doc");
  const mq=vMcq(u).length;if(mq>=3&&!has(u.letters)&&!has(u.words))a.push("dungsai");
  if(mq>=3)a.push("dua");
  return u._acts=a.sort((x,y)=>VA[x].lv-VA[y].lv);
}
const vDone=u=>{const d=P().done[u.key]||{};return vActs(u).filter(a=>d[a]).length};
const vLevelPct=li=>{let t=0,d=0;VLEVELS[li].units.forEach(u=>{t+=vActs(u).length;d+=vDone(u)});return t?Math.round(d/t*100):0};
const vNextUnit=()=>{for(const L of VLEVELS)for(const u of L.units)if(vDone(u)<vActs(u).length)return u;return null};
const vNext=(u,act)=>{const l=vActs(u),i=l.indexOf(act),n=i<0?null:l[i+1];return n?{go:`tv-g-${n}-${u.li}-${u.ui}`,em:VA[n].em,name:VA[n].n}:null};
const diffStars=n=>"⭐".repeat(n);
const diffName=n=>["","Dễ","Vừa","Khó"][n];

/* ---------- bộ chạy câu hỏi chung ---------- */
function vRun(u,act,qs,o={}){
  const back=o.back||vBack(u);
  render(shell(o.title||`${VA[act].em} ${VA[act].n} · ${esc(u.t)}`,back,qs.length));
  let r=0,score=0;
  const show=()=>{
    SAY=[];setProg(r);const q=qs[r];let miss=false,locked=false;
    $("#stage").innerHTML=`${q.q}${q.say?`<button class="btn sm" style="--c:var(--sky)" id="rep">🔊 Nghe</button>`:""}
      <div class="${q.basket?"baskets":"vopts"}">${q.opts.map((x,k)=>`<button class="tile vt ${o.pic?"pic":""}" data-k="${k}">${q.basket?`<span class="bk">🧺</span>`:""}${o.render?o.render(x):q.render?q.render(x):esc(x)}</button>`).join("")}</div>
      <div class="prompt" id="fb" style="min-height:1.4em"></div>`;
    if(q.say){if(o.autoSay!==false)sayVi(q.say);$("#rep").onclick=()=>sayVi(q.say)}
    document.querySelectorAll(".vt").forEach(t=>t.onclick=()=>{
      if(locked)return;const x=q.opts[+t.dataset.k];
      if(x===q.a){locked=true;t.classList.add("good","pop");sGood();if(!miss){score++;$("#gs").textContent=score}
        $("#fb").innerHTML=q.after?`✅ ${esc(q.after)}`:"✅ Đúng rồi!";if(q.after)sayVi(q.after);
        setTimeout(()=>{r++;r<qs.length?show():end()},q.after?1700:1100);
      }else{miss=true;t.classList.add("bad");bump(t);sBad();
        if(strictFail(o.again||(()=>vPlay(act,u)),`Đáp án đúng: <b>${o.render?o.render(q.a):q.render?q.render(q.a):esc(q.a)}</b>`))return}
    });
  };
  const end=()=>{if(o.onEnd)return o.onEnd(score,qs.length);
    finish({stars:score,max:qs.length,back,key:u.key,act,again:o.again||(()=>vPlay(act,u)),vi:true,next:o.next!==undefined?o.next:vNext(u,act)})};
  show();
}

/* ---------- các trò chơi ---------- */
function vPlay(act,u){
  const again=()=>vPlay(act,u);
  if(act==="the")return vFlash(u);
  if(act==="noi")return vMatch(u);
  if(act==="chuot")return vWhack(u);
  if(act==="dau")return vTone(u);
  if(act==="ghep")return vGhep(u);
  if(act==="xep")return vSent(u);
  if(act==="doc")return vRead(u);
  if(act==="dua")return vRace(u);
  if(act==="nghe"){
    if(u.letters){const pool=vLevelPool(u,"letters").map(x=>x.ch);
      return vRun(u,act,cycle(u.letters,6).map(l=>({q:`<div class="prompt">Nghe và chọn chữ đúng</div>`,say:"chữ "+l.name,a:l.ch,opts:pickOpts(l.ch,pool),render:letterHTML})),{again})}
    const pool=vLevelPool(u,"words"),picOf={};pool.forEach(w=>picOf[w.w]=w.pic);
    return vRun(u,act,cycle(u.words,8).map(w=>({q:`<div class="prompt">Nghe và chọn hình đúng</div>`,say:w.w,a:w.w,after:w.w,
      opts:pickOpts(w.w,pool.filter(x=>x.pic!==w.pic).map(x=>x.w)),render:x=>picOf[x]})),{again,pic:true});
  }
  if(act==="dungsai")return vRun(u,act,shuffle(vMcq(u)).slice(0,8).map(q=>{const ok=Math.random()<.5,cand=ok?q.a:shuffle(q.opts.filter(x=>x!==q.a))[0],show=x=>q.render?q.render(x):esc(x);
    return{q:`${q.q}<div class="prompt">Đáp án: <span class="cand">${show(cand)}</span></div>`,a:ok?"Đúng":"Sai",opts:["Đúng","Sai"],after:q.after||("Đáp án đúng: "+q.a)}}),{again});
  if(act==="dien")return vRun(u,act,shuffle(vMcq({...u,letters:null,words:null,sort:null,quiz:null,pairs:null})),{again,autoSay:false});
  if(act==="loai")return vRun(u,act,shuffle(vMcq({...u,letters:null,words:null,ct:null,quiz:null,pairs:null})),{again});
  if(act==="trac")return vRun(u,act,shuffle(vMcq({...u,letters:null,words:null,ct:null,sort:null})).slice(0,10),{again,autoSay:false});
}

/* Thẻ học */
function vFlash(u){
  const cards=u.letters?u.letters.map(l=>({front:`<div class="vbig">${esc(l.ch.toUpperCase())} ${esc(l.ch)}</div><div class="p">${l.pic}</div><div class="w">${esc(l.ex)}</div>`,say:`chữ ${l.name}. ${l.ex}`}))
    :u.words.map(w=>({front:`<div class="p">${w.pic}</div><div class="w">${esc(w.w)}</div>`,say:w.w}));
  render(shell(`🃏 Thẻ học · ${esc(u.t)}`,vBack(u),cards.length));
  let i=0;
  const show=()=>{SAY=[];setProg(i);const c=cards[i];
    $("#stage").innerHTML=`<div class="prompt">Bé nghe rồi nói to theo nhé!</div><div class="vcard">${c.front}</div>
      <div class="row" style="justify-content:center"><button class="btn ghost" id="prev" ${i?"":"disabled"}>◀</button>
      <button class="btn" style="--c:var(--sky)" id="hear">🔊 Nghe</button><button class="btn" id="next">${i===cards.length-1?"Xong ✓":"▶"}</button></div>`;
    sayVi(c.say);$("#hear").onclick=()=>sayVi(c.say);
    $("#prev").onclick=()=>{if(i){i--;show()}};
    $("#next").onclick=()=>{if(i<cards.length-1){i++;show()}else finish({stars:3,back:vBack(u),key:u.key,act:"the",again:()=>vFlash(u),vi:true,next:vNext(u,"the"),label:"Học xong thẻ! Bé được"})};
  };
  show();
}

/* Lật thẻ ghép đôi */
function vMatch(u){
  const src=u.letters?u.letters.map(l=>({a:`<span class="vlt">${esc(l.ch.toUpperCase())}</span>`,b:`<span class="vlt">${esc(l.ch)}</span>`,say:"chữ "+l.name}))
    :u.words?u.words.map(w=>({a:w.pic,b:esc(w.w),say:w.w,bw:1}))
    :u.pairs.items.map(p=>({a:esc(p.a),b:esc(p.b),say:p.say||(p.a+", "+p.b),aw:1,bw:1}));
  const ps=shuffle(src).slice(0,6);
  render(shell(`🧩 Lật thẻ ghép đôi · ${esc(u.t)}`,vBack(u),ps.length));

/* Đập chuột */
function vWhack(u){
  const items=u.letters?u.letters.map(l=>({key:l.ch,show:`<span class="vl">${esc(l.ch)}</span>`,say:"chữ "+l.name,ans:`chữ <b>${esc(l.ch)}</b>`}))
    :u.words.map(w=>({key:w.w,show:w.pic,say:w.w,ans:`<b>${esc(w.w)}</b> ${w.pic}`}));
  const pool=u.letters?vLevelPool(u,"letters").map(l=>({key:l.ch,show:`<span class="vl">${esc(l.ch)}</span>`}))
    :vLevelPool(u,"words").map(w=>({key:w.w,show:w.pic,pic:w.pic}));
  const rounds=cycle(items,u.letters?6:8);
  render(shell(`🔨 Đập chuột · ${esc(u.t)}`,vBack(u),rounds.length));
  let r=0,score=0,timers=[],alive=true;
  const clearAll=()=>{timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[]};
  stopMedia=()=>{alive=false;clearAll()};
  const end=()=>{clearAll();finish({stars:score,max:rounds.length,back:vBack(u),key:u.key,act:"chuot",again:()=>vWhack(u),vi:true,next:vNext(u,"chuot")})};
  const nextRound=ms=>timers.push(setTimeout(()=>{r++;r<rounds.length?round():end()},ms));
  const round=()=>{
    clearAll();setProg(r);const w=rounds[r];let done=false;
    const others=shuffle(pool.filter(x=>x.key!==w.key&&(!x.pic||x.show!==w.show))).slice(0,3);
    $("#stage").innerHTML=`<div class="prompt" id="wp">Nghe rồi đập đúng chú chuột <button class="btn sm" style="--c:var(--sky)" id="rep">🔊</button></div>
      <div class="field">${Array.from({length:9},(_,k)=>`<div class="hole"></div>`).join("")}</div>`;
    $("#rep").onclick=()=>sayVi(w.say);sayVi(w.say);
    const holes=[...document.querySelectorAll(".hole")],life=Math.max(1200,2200-r*90-u.li*80);
    const spawn=()=>{if(done||!alive)return;const free=holes.filter(h=>!h.firstChild);if(!free.length)return;
      const h=free[Math.random()*free.length|0],up=holes.some(x=>x.firstChild&&x.firstChild.dataset.t==="1");
      const o=(!up&&Math.random()<.55)?w:(others[Math.random()*others.length|0]||w);
      const m=document.createElement("button");m.className="mole";m.dataset.t=o.key===w.key?"1":"0";m.setAttribute("aria-label","Chú chuột");
      m.innerHTML=`<span class="mp">${o.show}</span><span class="mf">🐭</span>`;
      m.onclick=()=>{if(done)return;
        if(m.dataset.t==="1"){done=true;m.classList.add("bonk");tone(260,.08,"square",0,.15);sGood();score++;$("#gs").textContent=score;sayVi(w.say);nextRound(1200)}
        else{m.classList.add("ouch");sBad();if(strictFail(()=>vWhack(u),`Bé cần đập ${w.ans}`))return;timers.push(setTimeout(()=>m.remove(),300))}};
      h.appendChild(m);timers.push(setTimeout(()=>{if(m.isConnected&&!m.classList.contains("bonk"))m.remove()},life))};
    spawn();timers.push(setInterval(spawn,Math.round(life*.5)));
    timers.push(setTimeout(()=>{if(done)return;done=true;if(strictFail(()=>vWhack(u),`Hết giờ! Đáp án: ${w.ans}`))return;
      $("#wp").innerHTML=`Hết giờ! Đáp án: ${w.ans}`;nextRound(1800)},15000));
  };
  round();
}

/* Bé đọc to (micrô) */
let VDICT_OFF=false;
function vRead(u){
  const items=[...(u.words?shuffle(u.words).slice(0,4).map(w=>({t:w.w,pic:w.pic})):[]),...(u.sents||[]).map(s=>({t:s}))];
  render(shell(`🎙️ Bé đọc to · ${esc(u.t)}`,vBack(u),items.length));
  let r=0,score=0;
  const next=()=>{r++;r<items.length?show():finish({stars:score,max:items.length,back:vBack(u),key:u.key,act:"doc",again:()=>vRead(u),vi:true,next:vNext(u,"doc")})};
  const show=()=>{
    SAY=[];setProg(r);const it=items[r];let tries=0,passed=false,subs=[],silenceT,maxT,heard="",partial="";
    const cleanup=()=>{subs.forEach(f=>{try{f()}catch(e){}});subs=[];clearTimeout(silenceT);clearTimeout(maxT)};
    stopMedia=()=>{cleanup();dstop();try{speechSynthesis.cancel()}catch(e){}stopVi()};
    $("#stage").innerHTML=`<div class="prompt">Bé đọc to và rõ ràng. Đọc đúng mới qua!</div>
      ${it.pic?`<div class="bigpic" style="width:min(140px,38vw);font-size:4.2rem">${it.pic}</div>`:""}
      <div class="speakline" id="sl">${normVi(it.t).length?it.t.split(" ").map(w=>`<span class="rw">${esc(w)}</span>`).join(" "):esc(it.t)}</div>
      <button class="btn sm" style="--c:var(--sky)" id="rep">🔊 Nghe mẫu</button>
      <div id="ctl" class="row" style="justify-content:center"></div><div class="heard" id="heard"></div>`;
    const sl=$("#sl"),heardEl=$("#heard"),ctl=$("#ctl");
    $("#rep").onclick=()=>{if(!(DICT&&DICT.active()))sayVi(it.t)};
    const paint=t=>{const ht=normVi(t);sl.querySelectorAll(".rw").forEach(s=>{const tk=normVi(s.textContent);s.classList.toggle("hit",tk.length>0&&tk.every(x=>ht.includes(x)))})};
    const success=()=>{if(passed)return;passed=true;cleanup();dstop();sGood();score++;$("#gs").textContent=score;
      sl.querySelectorAll(".rw").forEach(s=>s.classList.add("hit"));heardEl.innerHTML=`<b class="okmsg">🎉 Đúng rồi! Giỏi quá!</b>`;ctl.innerHTML="";setTimeout(next,1700)};
    const failed=()=>{tries++;sBad();bump(sl);const t=(heard+" "+partial).trim();
      heardEl.innerHTML=t?`Cú Bông nghe được: “${esc(t)}”<br>Bé nghe mẫu rồi đọc lại nhé!`:"Cú Bông chưa nghe thấy gì. Bé đọc to hơn nhé!";drawCtl()};
    const useMic=()=>DICT&&!DICT_OFF&&!VDICT_OFF;
    const drawCtl=()=>{const skip=tries>=3?`<button class="btn sm ghost" id="skip">Bỏ qua</button>`:"";
      if(useMic()){ctl.innerHTML=`<button class="btn big mic" id="mic" style="--c:var(--berry)">🎙️ ${tries?"Bé đọc lại":"Bé đọc"}</button>${skip}`;$("#mic").onclick=listen}
      else{ctl.innerHTML=`<button class="btn big" style="--c:var(--leaf)" id="okp">✓ Bé đọc đúng rồi</button>${skip}<div class="muted" style="flex-basis:100%;font-size:.9rem">Thiết bị này chưa nghe được giọng bé. Phụ huynh nghe bé đọc, đúng thì bấm ✓.</div>`;$("#okp").onclick=success}
      const sk=$("#skip");if(sk)sk.onclick=()=>{cleanup();dstop();next()}};
    const upd=()=>{const t=(heard+" "+partial).trim();heardEl.textContent=t?`🎧 “${t}”`:"Cú Bông đang nghe…";paint(t);
      if(vMatchOK(it.t,t))return success();clearTimeout(silenceT);if(t)silenceT=setTimeout(dstop,2300)};
    const listen=()=>{
      if(DICT.active()){dstop();return}
      let p;try{p=DICT.start({language:"vi"})}catch(e){VDICT_OFF=true;drawCtl();return}
      try{speechSynthesis.cancel()}catch(e){}stopVi();cleanup();heard="";partial="";
      subs.push(DICT.onFinal(e=>{heard+=e.text;upd()}),DICT.onPartial(e=>{partial=e.text;upd()}),DICT.onState(e=>{
        const m=$("#mic");if(e.state==="listening"&&m){m.classList.add("on");m.textContent="🔴 Bé đang đọc… (chạm để dừng)";heardEl.textContent="Cú Bông đang nghe…"}
        if(e.state==="idle"){cleanup();if(passed)return;if(vMatchOK(it.t,heard+" "+partial))return success();
          if(e.reason==="not_granted"||e.reason==="unavailable"){VDICT_OFF=true;drawCtl();return}
          if(e.reason==="rate_limited"||e.reason==="upstream_error"){toast("Micrô đang bận, bé thử lại sau chút nhé!");drawCtl();return}
          if(e.reason==="stopped"||e.reason==="viewer_stopped"||e.reason==="time_limit")return failed();drawCtl()}}));
      p.catch(err=>{const c=err&&err.code;
        if(c==="dismissed")toast("Bé bấm lại 🎙️ và chọn Cho phép để Cú Bông nghe được nhé!",3200);
        else if(c==="not_granted"||c==="unavailable"){VDICT_OFF=true;toast("Chưa nghe được tiếng Việt qua micrô, chuyển sang để phụ huynh chấm.",3200);drawCtl()}
        else if(c!=="stopped")drawCtl()});
      maxT=setTimeout(dstop,15000);
    };
    drawCtl();setTimeout(()=>sayVi(it.t),300);
  };
  show();
}

      else{t.classList.add("bad");bump(t);sBad();if(strictFail(()=>vRace(u,o),`Đáp án đúng: <b>${q.render?q.render(q.a):esc(q.a)}</b>`))return;timers.push(setTimeout(ask,1000))}});
  };
  $("#go").onclick=()=>{let n=3;$("#q").innerHTML=`<div class="count" id="cd">3</div>`;tone(440,.15);
